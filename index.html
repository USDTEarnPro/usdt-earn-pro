<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT EARN PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0b141a; color: white; font-family: Arial, sans-serif; margin: 0; padding: 20px; text-align: center; }
        .card { background: linear-gradient(145deg, #11241f, #0d1a17); border: 1px solid #1f4a3d; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        h1 { color: #00ff88; font-size: 24px; }
        .balance { font-size: 36px; font-weight: bold; }
        .btn { background-color: #00ff88; color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>USDT EARN PRO</h1>
    <div class="card">
        <p>Available USDT Balance</p>
        <div class="balance" id="user-balance">0.053 USDT</div>
        <button class="btn" onclick="withdraw()">Withdraw</button>
    </div>
    <div class="card">
        <h3>Watch & Earn</h3>
        <button class="btn" onclick="watchAd()">Watch Ad (+0.001 USDT)</button>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        function withdraw() { alert("Withdraw coming soon!"); }
        function watchAd() { alert("Ad system coming soon!"); }
    </script>
</body>
</html>
